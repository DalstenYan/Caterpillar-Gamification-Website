<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat {XYZ}</title>

</head>


<body>

    <div id="nav-placeholder"></div>
    <script>
        fetch('assets/topnav.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('nav-placeholder').innerHTML = data;
        });

        async function loadLeaderboard() {
            try {
                const response = await fetch('/leaderboard');
                const data = await response.json();

                const tbody = document.getElementById('leaderboardBody');
                tbody.innerHTML = "";

                if (data.success && data.leaderboard.length > 0) {
                    data.leaderboard.forEach((emp, index) => {
                        const row = `
          <tr>
            <td>${index + 1}</td>
            <td>${emp.Name}</td>
            <td>${emp.Points}</td>
          </tr>
        `;
                        tbody.innerHTML += row;
                    });
                } else {
                    tbody.innerHTML = "<tr><td colspan='3'>No data available</td></tr>";
                }
            } catch (err) {
                console.error("Error loading leaderboard:", err);
            }
        }

        // Load the leaderboard on page load
        loadLeaderboard();

        document.getElementById("homeBtn").addEventListener("click", () => {
            window.location.href = "_index.html";
        });
    </script>

<div class="page">

    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Name</th>
                <th>Points</th>
            </tr>
        </thead>
        <tbody id="leaderboardBody">
            <!-- Populated by POST method in Server.js -->
        </tbody>
    </table>

    <ul class="navlinks">
      <li><a href="leaderboard-use-points.html">Utilize points</a></li>
      <li><a href="user-log-activity.html">Point Activity Log</a></li>
    </ul>


</div>


</body>


</html>
