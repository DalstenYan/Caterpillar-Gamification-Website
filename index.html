<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GOC Login</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      background: #f9fafb;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: #FFCC00;
      color: black;
      text-align: center;
      padding: 1.5rem 0;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-top: 0;
      text-align: center;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    label {
      font-weight: bold;
    }
    input {
      padding: 0.6rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      width: 100%;
    }
    button {
      background: #FFCC00;
      color: black;
      border: none;
      padding: 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      font-weight: bold;
    }
    button:hover {
      background: #e6b800;
    }
    .error {
      color: red;
      text-align: center;
      font-weight: bold;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>GOC Login</h1>
  </header>
  
  <main>
    <div class="login-card">
      <h2>Prototype Login Page</h2>
      <form id="loginForm">
        <div>
          <label for="CWS">CWS:</label>
          <input type="text" id="CWS" name="CWS" required />
        </div>
        <div>
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit">Login</button>
      </form>
      <div id="errorMessage" class="error"></div>
    </div>
  </main>
  
  <footer>
    &copy; 2025 Copyright
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(event) {
      event.preventDefault();

      const CWS = document.getElementById('CWS').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = "";

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ CWS, password })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          alert("Login successful!");
          window.location.href = 'dashboard.html';
        } else {
          errorDiv.textContent = result.message || "Invalid CWS or password.";
        }
      } catch (err) {
        errorDiv.textContent = "Error connecting to server.";
      }
    });
  </script>
</body>
</html>
