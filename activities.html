<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat {XYZ}</title>

</head>


<body>

    <div id="nav-placeholder"></div>
    <script>
        fetch('assets/topnav.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('nav-placeholder').innerHTML = data;
        });
    </script>

<div class="page">

    <h1>Activities</h1>

    <ul class="navlinks">
      <li><a href="activity-stop-to-fix.html">Stop to Fixes</a></li>
      <li><a href="activity-high-energy-check.html">High Energy Check</a></li>
      <li><a href="activity-area-work-cleaning.html">Area Work Cleaning</a></li>
      <li><a href="daily-inspection.html">Daily Inspections</a></li>
    </ul>

    <p>Points: <span id="points">0</span></p>

<button onclick="add(1)">+1</button>
<button onclick="add(5)">+5</button>
<button onclick="add(10)">+10</button>

<script>
async function loadScore() {
    const res = await fetch("/point");
    const data = await res.json();
    document.getElementById("points").textContent = data.total;
}

async function add(amount) {
    const res = await fetch("/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount })
    });

    const data = await res.json();

    if (data.success) {
        document.getElementById("points").textContent = data.total;
    }
}

loadScore();
</script>
</div>


</body>


</html>
