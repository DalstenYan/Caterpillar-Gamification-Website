<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

</head>

<body onload="displaySpinWheelOnOpen()">

  <div id="nav-placeholder"></div>
  <script>
    fetch('assets/topnav.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('nav-placeholder').innerHTML = data;
      });
  </script>

<div class="page">
  <h1>Dashboard</h1>

  <!-- Start of Wheel & Popup Code -->
    <div class="popup" id="popup">
        <img src="./assets/chance_button.png">
        <h2>Spin to win!</h2>
        <div class="wheel-container">
            <div class="spinBtn">Spin</div>
            <div class="wheel">
                <div class="number" style="--i:1; --clr:#db7093;"><span>100</span></div>
                <div class="number" style="--i:2; --clr:#8270db;"><span>80</span></div>
                <div class="number" style="--i:3; --clr:#7edb70;"><span>30</span></div>
                <div class="number" style="--i:4; --clr:#db8970;"><span>50</span></div>
                <div class="number" style="--i:5; --clr:#b670db;"><span>90</span></div>
                <div class="number" style="--i:6; --clr:#db7070;"><span>120</span></div>
                <div class="number" style="--i:7; --clr:#70dbc6;"><span>20</span></div>
                <div class="number" style="--i:8; --clr:#dbdb70;"><span>90</span></div>
            </div>
        </div>
        <p>Click SPIN to claim your daily login.</p>
        <button type="button" onclick="closePopup()">OK</button>
    </div>
    <!-- End of Wheel & Popup Code -->

  <div class="cardgrid">

    <a href="manager-employee-database.html" class="dashboard-card">
      <div class="dashboard-card-icon">
        <span class="material-icons">emoji_people</span>
      </div>
      <div class="dashboard-card-title">Employee Database</div>
    </a>

    <a href="manager-logs-activity.html" class="dashboard-card">
      <div class="dashboard-card-icon">
        <span class="material-icons">browse_gallery</span>
      </div>
      <div class="dashboard-card-title">Activity Logs</div>
    </a>

    <a href="manager-logs-reports.html" class="dashboard-card">
      <div class="dashboard-card-icon">
        <span class="material-icons">report</span>
      </div>
      <div class="dashboard-card-title">Report Logs</div>
    </a>
    
  </div>

<h3>Today you still haven't.....</h3>
  <ul class="navlinks">
      <li><a href="daily-spin.html">Daily Spin</a></li>
      <li><a href="daily-trivia.html">Daily Trivia</a></li>
      <li><a href="daily-inspection.html">Daily Inspection</a></li>
  </ul>

      </div>
    <!-- Scripts -->
     <script>
    let popup = document.getElementById("popup");
    let wheel = document.querySelector('.wheel');
    let spinBtn = document.querySelector('.spinBtn');
    let value = Math.ceil(Math.random() * 3600);
    let hasBeenClicked = false;

        function displaySpinWheelOnOpen(){
            popup.classList.add("open-popup")
        }
        function closePopup(){
            popup.classList.remove("open-popup")
        }
        spinBtn.onclick = function(){
            if(!hasBeenClicked){
                hasBeenClicked = true;
                wheel.style.transform = "rotate(" + value + "deg)";
                value += Math.ceil((Math.random() * 3600));
            }
        }
    </script>
</body>
</html>
